
name: Grade Checks Pytest

on:
  push:
    paths:
      - 'grade_average.py'
      - 'grade_pass.py'
      - 'test_grade_average.py'
      - 'test_grade_pass.py'
      - '.github/workflows/pytest.yml'

  pull_request:
    paths:
      - 'grade_average.py'
      - 'grade_pass.py'
      - 'test_grade_average.py'
      - 'test_grade_pass.py'
      - '.github/workflows/pytest.yml'

concurrency:
  group: grade-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov

      - name: Run Pytest
        run: python -m pytest -v
